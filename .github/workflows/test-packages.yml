name: Slint test packages

on:
  workflow_call:
    inputs:
      upload_artifacts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Explicitly save test installers/DMGs as workflow artifacts (no GitHub Release)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup show
      - run: cargo metadata --locked --format-version 1 > metadata.json
      - run: python3 scripts/check_ringbuf_exception.py metadata.json
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny0.20.2
        with:
          rust-version: 1.92.0
          arguments: --locked
          command: check
          command-arguments: advisories licenses sources
  package:
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-cargo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: slint-test-package-${{ matrix.target }}
          # Package outputs stay in target/test-packages, outside this cache.
          workspaces: ". -> target/ci-cargo"
          cache-on-failure: true
      - name: Portable package tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Test Windows version metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/tests/test_windows_version.ps1
          powershell.exe -NoProfile -NonInteractive -File ./scripts/tests/test_windows_version.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell metadata regression failed" }
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Rust tests with controlled swarms
        run: cargo test --locked --all-targets --target ${{ matrix.target }} -j 2
      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -j 2 -- -D warnings
      - name: Install pinned notices tool
        run: cargo install cargo-about --version 0.9.2 --features cli --locked -j 2
      - name: Generate and verify locked license coverage
        run: python scripts/generate_notices.py --target ${{ matrix.target }} --output target/test-notices/${{ matrix.target }}
      - name: Build local test Mac app and DMG
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh --target ${{ matrix.target }} --notices target/test-notices/${{ matrix.target }} --dmg --output target/test-packages/${{ matrix.target }}/FlowTorrent.app
      - name: Build unsigned per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Output target/test-packages/${{ matrix.target }} -Notices target/test-notices/${{ matrix.target }}
      - name: Disposable Windows install/reinstall/uninstall preservation check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/test-packages/${{ matrix.target }}/*-setup.exe
          $version = (Get-Item $installer.FullName).VersionInfo.ProductVersion.TrimEnd()
          ./scripts/tests/test_installer_windows.ps1 -Installer $installer.FullName -Version $version -DisposableProfile
      - name: Save test artifacts only when explicitly requested
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FlowTorrent-local-test-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/test-packages/**/*.dmg*
            target/test-packages/**/*-setup.exe*
            target/test-packages/**/installer-smoke.json
