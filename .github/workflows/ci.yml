name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Diagnose macOS multicast socket sharing
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          import socket
          for receiver_reuse_port in (False, True):
              receiver = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sender = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  receiver.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  if receiver_reuse_port:
                      receiver.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEPORT, 1)
                  receiver.bind(('0.0.0.0', 0))
                  receiver.setsockopt(socket.IPPROTO_IP, socket.IP_ADD_MEMBERSHIP,
                                      socket.inet_aton('239.192.152.143') + socket.inet_aton('0.0.0.0'))
                  sender.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  sender.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEPORT, 1)
                  try:
                      sender.bind(receiver.getsockname())
                      result = 'both binds succeeded'
                  except OSError as error:
                      result = repr(error)
                  print(f'::notice::Multicast receiver SO_REUSEPORT={receiver_reuse_port}: {result}')
              finally:
                  receiver.close()
                  sender.close()
          for family, option in ((socket.AF_INET, 'v4'), (socket.AF_INET6, 'v6'), (socket.AF_INET6, 'v4')):
              receiver = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sender = socket.socket(family, socket.SOCK_DGRAM)
              try:
                  receiver.bind(('0.0.0.0', 0))
                  receiver.setsockopt(socket.IPPROTO_IP, socket.IP_ADD_MEMBERSHIP,
                                      socket.inet_aton('239.192.152.143') + socket.inet_aton('127.0.0.1'))
                  receiver.settimeout(0.5)
                  if family == socket.AF_INET6:
                      sender.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 0)
                      sender.bind(('::', 0))
                      destination = ('::ffff:239.192.152.143', receiver.getsockname()[1])
                  else:
                      sender.bind(('0.0.0.0', 0))
                      destination = ('239.192.152.143', receiver.getsockname()[1])
                  if option == 'v6':
                      sender.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_MULTICAST_IF, socket.if_nametoindex('lo0'))
                  else:
                      sender.setsockopt(socket.IPPROTO_IP, socket.IP_MULTICAST_IF, socket.inet_aton('127.0.0.1'))
                  sender.sendto(b'flowtorrent-multicast-probe', destination)
                  payload, address = receiver.recvfrom(1024)
                  result = f'received {payload!r} from {address}'
              except OSError as error:
                  result = repr(error)
              finally:
                  receiver.close()
                  sender.close()
              print(f'::notice::Multicast family={family} interface_option={option}: {result}')
          PY
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --all-targets --target ${{ matrix.target }}
      - name: Run tests (local swarm only)
        run: cargo test --locked --all-targets --target ${{ matrix.target }}
