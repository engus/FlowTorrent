[package]
name = "flowtorrent"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "A minimal, ad-free desktop torrent client"
repository = "https://github.com/engus/FlowTorrent"
build = "build.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
directories = "6"
librqbit-bencode = "=9.0.1"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "system-tray", "accessibility"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net"] }
tracing = "0.1"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
librqbit-dualstack-sockets = "=0.7.0"
socket2 = "0.6"
sha1 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dev-dependencies]
junction = "=2.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
