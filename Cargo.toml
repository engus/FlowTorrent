[workspace]
members = ["apps/desktop"]
default-members = ["apps/desktop"]
resolver = "3"
exclude = ["vendor/librqbit"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.compact]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = "symbols"

[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-lsd = { path = "vendor/librqbit-lsd" }
librqbit-bencode = { path = "vendor/librqbit-bencode" }
