[package]
name = "flowtorrent"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "A minimal, ad-free desktop torrent client"
repository = "https://github.com/engus/FlowTorrent"
build = "build.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
directories = "6"
librqbit-bencode = "=9.0.1"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "=1.0.6"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "system-tray", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
open = "5"
sys-locale = "0.3"
single-instance = "=0.3.3"
interprocess = { version = "=2.4.7", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Security"] }
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation"] }
widestring = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSThread", "NSObject", "NSBundle", "NSFileManager", "NSURL", "NSError"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSView", "block2", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSCell", "NSMenu", "NSMenuItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "=0.6.2"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
librqbit-dualstack-sockets = "=0.7.0"
socket2 = "0.6"
sha1 = "0.10"

[target.'cfg(windows)'.dev-dependencies]
junction = "=2.1.0"
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "=0.7.0"
